upstream fiapf3_account {
    server account:8080;
}

upstream fiapf3_garage {
    server garage:3900;
}

upstream fiapf3_keycloak {
    server keycloak:8080;
}

upstream fiapf3_grafana {
    server grafana:3000;
}

# Dedicated host for Keycloak Admin Console (full proxy).
# Dev: keycloak.localhost | Prod: keycloak.<public-host> (DNS/hosts → same IP as the app).
server {
    listen 80;
    server_name ~^keycloak\.;

    client_max_body_size 1m;

    location / {
        proxy_pass http://fiapf3_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}

# Dedicated host for Grafana (full proxy).
# Dev: grafana.localhost | Prod: grafana.<public-host> (DNS/hosts → same IP as the app).
server {
    listen 80;
    server_name ~^grafana\.;

    client_max_body_size 1m;

    location / {
        proxy_pass http://fiapf3_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80 default_server;
    server_name _;

    # Dealership joins this network from its own Compose. Resolve at request time
    # so Nginx starts while that container is still absent.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    # OpenAPI / Swagger UI (paths outside /api rewrite)
    location ~ ^/api/account/(?<docpath>swagger(?:-ui/.*)?|v3/api-docs.*)$ {
        proxy_pass http://fiapf3_account/$docpath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect /swagger-ui/ /api/account/swagger-ui/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/dealership/(?<docpath>swagger(?:-ui/.*)?|v3/api-docs.*)$ {
        set $dealership_upstream dealership:8080;
        proxy_pass http://$dealership_upstream/$docpath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect /swagger-ui/ /api/dealership/swagger-ui/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/account/ {
        proxy_pass http://fiapf3_account/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/dealership/ {
        set $dealership_upstream dealership:8080;
        rewrite ^/api/dealership/(.*)$ /api/$1 break;
        proxy_pass http://$dealership_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /fiapf3-vehicle-photos/ {
        client_max_body_size 20m;
        proxy_pass http://fiapf3_garage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        default_type text/plain;
        return 200 'FIAP Car Sales API gateway\n';
    }
}
