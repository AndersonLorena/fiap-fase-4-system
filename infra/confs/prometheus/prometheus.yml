global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: account
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account:8080']
        labels:
          application: account
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: dealership
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['dealership:8080']
        labels:
          application: dealership
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']
        labels:
          application: keycloak
    scrape_interval: 15s
    scrape_timeout: 5s
