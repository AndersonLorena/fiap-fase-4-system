spring.application.name=account
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

account.frontend-origin=${FRONTEND_ORIGIN:http://localhost}
account.password-recovery-url=${PASSWORD_RECOVERY_URL:http://localhost/password-recovery}
account.password-recovery-ttl=PT15M
account.throttle.window=PT15M
account.throttle.max-attempts=20
account.lock.lease=PT30S
account.snowflake.machine-id=1

account.keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
account.keycloak.realm=${KEYCLOAK_REALM:fiap-car-sales}
account.keycloak.client-id=${KEYCLOAK_CLIENT_ID:account-api}
account.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:fiapf3-account-client-secret}
account.keycloak.jwks.connect-timeout=PT10S
account.keycloak.jwks.read-timeout=PT60S
account.keycloak.jwks.retry-attempts=3
account.keycloak.jwks.retry-backoff=PT2S

account.resend.api-key=${RESEND_API_KEY:}
account.resend.from=${RESEND_FROM:no-reply@fiapf3.local}
account.resend.base-url=https://api.resend.com

account.bootstrap.admin.enabled=false
account.bootstrap.admin.email=${ACCOUNT_BOOTSTRAP_ADMIN_EMAIL:admin@fiap-car-sales.com}
account.bootstrap.admin.password=${ACCOUNT_BOOTSTRAP_ADMIN_PASSWORD:Fiapf3Admin!}
account.bootstrap.admin.full-name=${ACCOUNT_BOOTSTRAP_ADMIN_FULL_NAME:Platform Admin}

account.s2s.allowed-client-ids=${ACCOUNT_S2S_ALLOWED_CLIENT_IDS:dealership-api}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${account.keycloak.url}/realms/${account.keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${account.keycloak.url}/realms/${account.keycloak.realm}/protocol/openid-connect/certs

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.url=/api/account/v3/api-docs
springdoc.swagger-ui.config-url=/api/account/v3/api-docs/swagger-config
springdoc.paths-to-match=/api/v1/**
