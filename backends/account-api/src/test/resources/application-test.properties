spring.datasource.url=jdbc:h2:mem:account;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

account.frontend-origin=http://localhost
account.password-recovery-url=http://localhost/password-recovery
account.password-recovery-ttl=PT15M
account.throttle.window=PT15M
account.throttle.max-attempts=100
account.lock.lease=PT30S
account.snowflake.machine-id=1

account.keycloak.url=http://localhost:8080
account.keycloak.realm=fiap-car-sales
account.keycloak.client-id=account-api
account.keycloak.client-secret=test-secret

account.resend.api-key=test-key
account.resend.from=no-reply@test.local
account.resend.base-url=http://localhost

account.test-jwt-secret=fiapf3-account-test-jwt-secret-key-32b

account.bootstrap.admin.enabled=false

account.s2s.allowed-client-ids=dealership-api
