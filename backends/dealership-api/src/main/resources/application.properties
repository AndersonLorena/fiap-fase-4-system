spring.application.name=dealership
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

dealership.frontend-origin=${FRONTEND_ORIGIN:http://localhost}
dealership.lock.lease=PT30S
dealership.snowflake.machine-id=2

dealership.keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
dealership.keycloak.realm=${KEYCLOAK_REALM:fiap-car-sales}
dealership.keycloak.client-id=${KEYCLOAK_CLIENT_ID:dealership-api}
dealership.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:fiapf3-dealership-client-secret}
dealership.keycloak.jwks.connect-timeout=PT10S
dealership.keycloak.jwks.read-timeout=PT60S
dealership.keycloak.jwks.retry-attempts=3
dealership.keycloak.jwks.retry-backoff=PT2S

dealership.account-api.base-url=${ACCOUNT_API_URL:http://localhost:8081}
dealership.payment.allowed-client-ids=${DEALERSHIP_PAYMENT_ALLOWED_CLIENT_IDS:payment-processor}

dealership.garage.endpoint=${GARAGE_ENDPOINT:http://localhost:3900}
dealership.garage.public-endpoint=${GARAGE_PUBLIC_ENDPOINT:http://localhost}
dealership.garage.region=${GARAGE_REGION:garage}
dealership.garage.bucket=${GARAGE_BUCKET:fiapf3-vehicle-photos}
dealership.garage.access-key=${GARAGE_ACCESS_KEY:}
dealership.garage.secret-key=${GARAGE_SECRET_KEY:}
dealership.garage.presigned-ttl=PT15M

dealership.upload-intent-secret=${UPLOAD_INTENT_SECRET:fiapf3-upload-intent-secret-please-change}

dealership.bootstrap.catalog.enabled=false
dealership.bootstrap.catalog.actor-id=0

spring.security.oauth2.resourceserver.jwt.issuer-uri=${dealership.keycloak.url}/realms/${dealership.keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${dealership.keycloak.url}/realms/${dealership.keycloak.realm}/protocol/openid-connect/certs

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.url=/api/dealership/v3/api-docs
springdoc.swagger-ui.config-url=/api/dealership/v3/api-docs/swagger-config
springdoc.paths-to-match=/api/v1/**
