spring.datasource.url=jdbc:h2:mem:dealership;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

dealership.frontend-origin=http://localhost
dealership.lock.lease=PT30S
dealership.snowflake.machine-id=2

dealership.keycloak.url=http://localhost:8080
dealership.keycloak.realm=fiap-car-sales
dealership.keycloak.client-id=dealership-api
dealership.keycloak.client-secret=test-secret

dealership.account-api.base-url=http://localhost:8081
dealership.payment.allowed-client-ids=payment-processor

dealership.garage.endpoint=http://localhost:3900
dealership.garage.public-endpoint=http://localhost
dealership.garage.region=garage
dealership.garage.bucket=fiapf3-vehicle-photos
dealership.garage.access-key=test
dealership.garage.secret-key=test
dealership.garage.presigned-ttl=PT15M

dealership.upload-intent-secret=fiapf3-test-upload-intent-secret
dealership.test-jwt-secret=fiapf3-dealership-test-jwt-secret-key-32b

dealership.bootstrap.catalog.enabled=false
dealership.bootstrap.catalog.actor-id=0
