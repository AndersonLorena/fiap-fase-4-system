name: Account CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: account-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backends/account-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backends/account-api/pom.xml
      - name: Verify
        run: ./mvnw -B verify

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backends/account-api
    steps:
      - uses: actions/checkout@v7
      - name: Docker build
        run: docker build -t fiapf3-account:ci .

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate dev Compose
        run: docker compose -f infra/compose/services.dev.yml --env-file infra/compose/.env.example config --quiet
      - name: Validate prod Compose
        run: docker compose -f infra/compose/services.prod.yml --env-file infra/compose/.env.prod.example config --quiet
